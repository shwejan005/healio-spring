# Server
server.port=8080

# Database Configuration
# Uses PostgreSQL in production (set DATABASE_URL env var)
# Falls back to H2 file-based for local development
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/healio}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (local dev only)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Clerk JWT validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=${CLERK_ISSUER_URL:https://classic-polliwog-60.clerk.accounts.dev}

# Gemini AI
gemini.api.key=${GEMINI_API_KEY:AIzaSyDaud21nHeRnso6qRb-yeKPbdrf0aadix4}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://healio-spring.vercel.app}
